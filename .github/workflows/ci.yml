name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + typecheck + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # sqlite3 CLI is required by tests/reorg-finder.e2e.test.ts and
      # tests/python-helpers.test.ts to build synthetic chia full_blocks
      # fixtures. Ubuntu runners include it by default but we install
      # defensively so the workflow doesn't silently rely on the runner image.
      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      # Surface the coverage summary in the workflow log so it's visible
      # without downloading the artifact. The JSON summary is more compact
      # than the HTML report.
      - name: Print coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
              console.log("Coverage:");
              console.log("  Statements: " + fmt(s.statements));
              console.log("  Branches:   " + fmt(s.branches));
              console.log("  Functions:  " + fmt(s.functions));
              console.log("  Lines:      " + fmt(s.lines));
            '
          else
            echo "No coverage-summary.json produced."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Advisory job: installs REAL chia-blockchain and asserts that the import
  # paths + methods scripts/_decode_*.py rely on still resolve. Catches upstream
  # chia drift that the tests/fixtures/fake_chia stub cannot. Intentionally NOT
  # in the branch-protection required checks — a chia packaging hiccup or a slow
  # install must never block a merge. The smoke test self-skips when chia isn't
  # importable, so it's inert everywhere except this job.
  chia-required:
    name: chia-required (import + API smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin to a Python version chia-blockchain supports.
          python-version: '3.11'
          # No `cache: pip` — this repo has no requirements.txt/pyproject.toml
          # for setup-python to key the cache on, and chia is installed ad-hoc
          # below. Caching would fail the step trying to find a lockfile.

      # The real-block round-trip test (tests/chia-real-blocks.test.ts) builds a
      # synthetic full_blocks DB via the sqlite3 CLI. Not present by default in
      # this job (the main `test` job installs it separately).
      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install chia-blockchain
        run: |
          python -m venv "$HOME/chia-venv"
          "$HOME/chia-venv/bin/pip" install --upgrade pip
          "$HOME/chia-venv/bin/pip" install chia-blockchain

      - name: Install dependencies
        run: npm ci

      - name: chia API smoke + real-block round-trip
        run: |
          # Point the chia-gated tests at the venv we just built. $HOME expands
          # in the shell here (it would not in a YAML `env:` mapping value).
          export CHIA_PYTHON="$HOME/chia-venv/bin/python"
          npx vitest run tests/chia-api-smoke.test.ts tests/chia-real-blocks.test.ts
